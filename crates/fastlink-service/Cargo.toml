[package]
name = "fastlink-service"
version = "0.1.0"
edition = "2021"
authors = ["Mamdouh Aboammar <mamdouhfces1997@gmail.com>"]
description = "Production-grade Rust microservice and reverse proxy for FastLink early navigation, speculative prefetch, and telemetry."
license = "MIT"

[dependencies]
fastlink-core = { path = "../fastlink-core" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
lazy_static = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
futures = "0.3"
url = "2.5"
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
