name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test tests/client
      - run: bun run test:skills
      - name: Typecheck browser runtime
        run: |
          npm install --no-save typescript@5.9.3
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM,DOM.Iterable --skipLibCheck client/src/index.ts client/src/core.ts client/src/signals.ts client/src/types.ts
      - run: bun run build:client
      - name: Verify checked-in runtime bundles
        run: git diff --exit-code -- client/fastlink.js client/fastlink.min.js skills/fast-link/assets/fastlink.min.js examples/wordpress/assets/fastlink.min.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps firefox
      - run: node tests/browser/fastlink.browser.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --all
      - run: cargo clippy --all-targets --all-features
      - name: Format check on modified Rust modules
        run: rustfmt --edition 2021 --check crates/fastlink-service/src/handlers/events.rs crates/fastlink-service/src/handlers/policies.rs crates/fastlink-service/src/handlers/prefetch.rs crates/fastlink-service/src/handlers/proxy.rs crates/fastlink-service/src/main.rs crates/fastlink-service/src/state.rs crates/fastlink-service/tests/service_tests.rs

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go test -race ./...
      - run: go vet ./...

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l examples/wordpress/fastlink-wp-plugin.php
      - run: php tests/wordpress/collector_test.php
