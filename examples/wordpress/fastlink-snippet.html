<!--
  FastLink WordPress Drop-In Integration Snippet
  Place this code inside your theme's footer.php (before </body>)
  or inject via "Insert Headers and Footers" plugin.
-->
<script src="/wp-content/plugins/fastlink/assets/fastlink.min.js" defer></script>
<script>
  window.addEventListener('DOMContentLoaded', function() {
    if (!window.FastLink) return;

    // Consent integration with WP Consent API, Cookiebot, or Complianz
    function checkWpConsent() {
      // 1. WP Consent API standard
      if (typeof window.wp_has_consent === 'function') {
        return window.wp_has_consent('marketing');
      }
      // 2. Cookiebot
      if (typeof window.Cookiebot !== 'undefined') {
        return !!(window.Cookiebot.consent && window.Cookiebot.consent.marketing);
      }
      // 3. Complianz
      if (typeof window.cmplz_has_consent === 'function') {
        return window.cmplz_has_consent('marketing');
      }
      // Fail closed if consent status is unconfirmed
      return false;
    }

    FastLink.init({
      mode: 'safe', // 'safe' mode preserves native WooCommerce and AJAX form behaviors
      navigation: {
        prefetch: 'same-origin',
        preserveNativeClicks: true,
        exclude: [
          '/wp-admin/*',
          '/wp-login.php*',
          '/wp-json/*',
          '/?wc-ajax=*',
          '/cart/?remove_item=*',
          '/logout'
        ]
      },
      signals: {
        collector: '/wp-json/fastlink/v1/events',
        consent: checkWpConsent,
        providers: {
          meta: true,
          tiktok: true,
          gtm: true
        }
      }
    });

    // Contact Form 7 Lead Verification Integration
    document.addEventListener('wpcf7mailsent', function(event) {
      FastLink.recordVerifiedLead({
        form_id: event.detail.contactFormId,
        plugin: 'contact-form-7'
      });
    }, false);

    // WooCommerce confirms AJAX additions via added_to_cart, not the button click.
    // Failed requests and invalid product variations must not become conversions.
    if (window.jQuery) {
      window.jQuery(document.body).on('added_to_cart.fastlink', function(event, fragments, cartHash, $button) {
        var target = $button && $button[0];
        if (!target) return;
        FastLink.recordEvent('AddToCart', {
          product_id: target.value || target.getAttribute('data-product_id')
        });
      });
    }
  });
</script>
